apiVersion: v1
kind: ConfigMap
metadata:
  name: dua-streamliner-config
  namespace: dua-streamliner
  labels:
    app: dua-streamliner
    component: backend
data:
  # Application Configuration
  NODE_ENV: "production"
  PORT: "3000"
  API_VERSION: "v1"
  APP_NAME: "dua-streamliner"
  LOG_LEVEL: "info"
  
  # Security Configuration
  JWT_EXPIRATION: "24h"
  JWT_REFRESH_EXPIRATION: "7d"
  CORS_CREDENTIALS: "true"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  ENCRYPTION_ALGORITHM: "aes-256-gcm"
  
  # Database Configuration
  DB_HOST: "postgres-service.dua-streamliner.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "dua_streamliner"
  DB_USER: "dua_admin"
  DB_SSL: "true"
  DB_POOL_MIN: "10"
  DB_POOL_MAX: "100"
  DB_POOL_IDLE_TIMEOUT_MS: "30000"
  DB_POOL_CONNECTION_TIMEOUT_MS: "5000"
  DB_RLS_ENABLED: "true"
  
  # AWS Configuration
  AWS_REGION: "us-east-1"
  S3_BUCKET_REGION: "us-east-1"
  ARCHIVE_RETENTION_DAYS: "30"
  
  # File Upload Configuration
  MAX_PAYLOAD_SIZE: "1048576"
  MAX_FILE_UPLOAD_SIZE: "10485760"
  ALLOWED_FILE_TYPES: ".docx,.doc,.xlsx,.xls,.pdf,.jpg,.jpeg,.png"
  UPLOAD_DIR: "/tmp/dua-uploads"
  
  # AI/ML Configuration
  OPENAI_MODEL: "gpt-4-turbo-preview"
  OPENAI_MAX_TOKENS: "4096"
  OPENAI_TEMPERATURE: "0.2"
  OCR_LANGUAGE: "spa+eng"
  OCR_PAGE_SEGMENTATION_MODE: "3"
  
  # RBAC Configuration
  DEFAULT_USER_ROLE: "CUSTOMS_OFFICER"
  ALLOWED_COUNTRIES: "CR"
  GEOLOCATION_ENABLED: "true"
  
  # Observability Configuration
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PORT: "9090"
  GRAFANA_ENABLED: "true"
  GRAFANA_PORT: "3001"
  LOGGING_ENABLED: "true"
  LOG_FILE_PATH: "/var/log/dua-streamliner"
  LOG_ROTATION_MAX_SIZE: "10m"
  LOG_ROTATION_MAX_FILES: "14"
  TRACK_LOGIN_EVENTS: "true"
  TRACK_FILE_UPLOADS: "true"
  TRACK_REPORT_GENERATION: "true"
  TRACK_FAILED_ATTEMPTS: "true"
  
  # Availability & Scaling
  MAINTENANCE_MODE: "false"
  HEALTH_CHECK_INTERVAL_MS: "30000"
  LOAD_BALANCER_ENABLED: "false"
  CACHE_ENABLED: "false"
  CACHE_TTL_SECONDS: "3600"
  
  # DevOps Configuration
  ARCHIVE_CLEANUP_CRON: "0 2 * * *"
  DB_BACKUP_CRON: "0 3 * * *"
  METRICS_AGGREGATION_CRON: "*/15 * * * *"
  CI_CD_ENABLED: "true"
  
  # Business Logic Algorithm Parameters
  CONFIDENCE_THRESHOLD: "0.75"
  MIN_FIELD_CONFIDENCE: "0.60"
  SEMANTIC_SIMILARITY_THRESHOLD: "0.80"
  FUZZY_MATCH_THRESHOLD: "85"
  MAX_CONCURRENT_REPORTS: "5"
  REPORT_GENERATION_TIMEOUT_MS: "300000"
  FIELD_VALIDATION_STRICT_MODE: "false"
  AUTO_CORRECTION_ENABLED: "true"
  
  # External Integration
  WEBHOOK_ENABLED: "false"
  WEBHOOK_RETRY_ATTEMPTS: "3"
  WEBHOOK_TIMEOUT_MS: "10000"
