apiVersion: v1
kind: Secret
metadata:
  name: dua-streamliner-secrets
  namespace: dua-streamliner
  labels:
    app: dua-streamliner
    component: backend
type: Opaque
stringData:
  # Security Secrets
  JWT_SECRET: "REPLACE_WITH_ACTUAL_SECRET_MIN_32_CHARS"
  ENCRYPTION_KEY: "REPLACE_WITH_ACTUAL_ENCRYPTION_KEY_MIN_32_CHARS"
  
  # Database Credentials
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  
  # AWS Credentials
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_KEY"
  S3_BUCKET_NAME: "dua-streamliner-archive-prod"
  
  # OpenAI API
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_API_KEY"
  
  # CORS Origins (production domains)
  CORS_ORIGINS: "https://dua-streamliner.example.com,https://app.dua-streamliner.example.com"
  
  # External API Keys (if applicable)
  CUSTOMS_API_KEY: ""
  CUSTOMS_API_ENDPOINT: ""
  MINISTERIO_HACIENDA_ENDPOINT: ""

---
# Note: In production, secrets should be managed using:
# - AWS Secrets Manager
# - HashiCorp Vault
# - Sealed Secrets
# - External Secrets Operator
#
# Example using kubectl (for development only):
# kubectl create secret generic dua-streamliner-secrets \
#   --from-literal=JWT_SECRET="your-secret-here" \
#   --from-literal=DB_PASSWORD="your-password" \
#   -n dua-streamliner
